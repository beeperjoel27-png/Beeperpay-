<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beeperpay | Dashboard</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  padding: 20px 15px;

  background: #07152e;

  color: white;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 500px;

  margin: auto;

}

.header {

  text-align: center;

  padding: 15px;

}

.header h1 { color: #e4b84e; }

.wallet {

  background: #122747;

  padding: 25px;

  border-radius: 15px;

  margin: 20px 0;

}

.balance {

  font-size: 32px;

  font-weight: bold;

  color: #e4b84e;

}

.services {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 12px;

}

.service {

  background: #122747;

  border-radius: 12px;

  padding: 22px 10px;

  text-align: center;

  color: white;

}

.service span {

  display: block;

  color: #e4b84e;

  font-size: 25px;

  margin-bottom: 10px;

}

a {

  text-decoration: none;

  color: #e4b84e;

}

button {

  width: 100%;

  padding: 14px;

  margin-top: 20px;

  border: none;

  border-radius: 7px;

  background: #e4b84e;

  color: #07152e;

  font-weight: bold;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

  <h1>BEEPERPAY</h1>

  <p>MICROFINANCE BANK</p>

  <p id="welcome">Loading customer...</p>

</div>

<div class="wallet">

  <p>My Wallet Balance</p>

  <div class="balance">₦0.00</div>

  <p>Demo balance — no real funds</p>

</div>

<h3>Banking Services</h3>

<div class="services">

  <div class="service">

    <span>＋</span>

    Add Money

  </div>

  <div class="service">

    <span>⇄</span>

    Transfer Money

  </div>

  <div class="service">

    <span>▤</span>

    Transactions

  </div>

  <div class="service">

    <span>▣</span>

    Airtime & Bills

  </div>

</div>

<p style="margin-top:25px">

  <a href="profile.html">My Profile</a>

</p>

<button id="logoutButton">LOGOUT</button>

<p style="text-align:center;font-size:12px;color:#bbb">

  Beeperpay demonstration platform. No live banking transactions are available.

</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = window.supabase.createClient(

  "https://wrjvcvxswdojpxzcwyqw.supabase.co",

  "sb_publishable_zTksapAhIoJp_0-9w1twlQ_j7WECGcv"

);

async function loadDashboard() {

  const { data, error } = await client.auth.getUser();

  if (error || !data.user) {

    window.location.href = "login.html";

    return;

  }

  const name = data.user.user_metadata.full_name ||

               data.user.email;

  document.getElementById("welcome").textContent =

    "Welcome, " + name;

}

document.getElementById("logoutButton").addEventListener("click", async () => {

  const { error } = await client.auth.signOut();

  if (error) {

    alert(error.message);

    return;

  }

  window.location.href = "login.html";

});

loadDashboard();

</script>

</body>

</html>
