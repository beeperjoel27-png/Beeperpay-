<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transfer Money - Beeperpay</title>

<style>

*{box-sizing:border-box}

body{font-family:Arial,sans-serif;background:#f3f5f9;color:#07152e;padding:20px;margin:0}

.container{max-width:480px;margin:30px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.07)}

.brand{text-align:center}

.brand h2{letter-spacing:2px;margin-bottom:5px}

.brand p{color:#b58a2b;font-size:12px;margin-top:0}

h3{margin-top:28px}

label{display:block;font-weight:bold;margin-top:16px}

input,select,textarea{width:100%;padding:13px;margin-top:7px;border:1px solid #ccd2dc;border-radius:7px;font-size:15px;background:white}

textarea{resize:vertical}

button{width:100%;padding:14px;margin-top:22px;background:#07152e;color:white;border:0;border-radius:7px;font-weight:bold;font-size:15px}

button:disabled{opacity:.6}

#message{margin-top:18px;line-height:1.6;overflow-wrap:anywhere}

.success{background:#e8f6ed;color:#176534;padding:12px;border-radius:7px}

.error{background:#fdecec;color:#a32020;padding:12px;border-radius:7px}

.links{text-align:center;margin-top:22px;line-height:2}

a{color:#07152e}

.notice{font-size:12px;color:#666;line-height:1.5;margin-top:20px}

</style>

</head>

<body>

<div class="container">

<div class="brand">

<h2>BEEPERPAY</h2>

<p>MICROFINANCE BANK</p>

</div>

<h3>Transfer Money</h3>

<form id="transferForm">

<label for="recipient">Recipient Full Name</label>

<input type="text" id="recipient" required placeholder="Enter recipient name">

<label for="account">Recipient Account Number</label>

<input type="text" id="account" inputmode="numeric" maxlength="10" required placeholder="10-digit account number">

<label for="bank">Recipient Bank</label>

<select id="bank" required>

<option value="">Select Bank</option>

<option>Access Bank</option>

<option>First Bank</option>

<option>GTBank</option>

<option>UBA</option>

<option>Zenith Bank</option>

<option>Fidelity Bank</option>

<option>FCMB</option>

<option>Wema Bank</option>

<option>Stanbic IBTC</option>

<option>Union Bank</option>

<option>OPay</option>

<option>Moniepoint</option>

<option>Kuda Bank</option>

<option>Other</option>

</select>

<label for="amount">Transfer Amount (₦)</label>

<input type="number" id="amount" min="100" step="1" required placeholder="Enter amount">

<label for="description">Description (Optional)</label>

<textarea id="description" rows="3" placeholder="Enter description"></textarea>

<button type="submit" id="submitButton">CONTINUE</button>

</form>

<div id="message" role="status"></div>

<div class="links">

<a href="dashboard.html">Back to Dashboard</a><br>

<a href="transactions.html">View Transaction History</a>

</div>

<p class="notice">

Demonstration only. No real bank transfer will take place.

No money will be deducted from any account.

</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = window.supabase.createClient(

"https://wrjvcvxswdojpxzcwyqw.supabase.co",

"sb_publishable_zTksapAhIoJp_0-9w1twlQ_j7WECGcv"

);

const form = document.getElementById("transferForm");

const message = document.getElementById("message");

const button = document.getElementById("submitButton");

async function getUser(){

  const {data,error}=await client.auth.getUser();

  if(error || !data.user){

    window.location.href="login.html";

    return null;

  }

  return data.user;

}

form.addEventListener("submit",async function(event){

  event.preventDefault();

  message.className="";

  message.textContent="";

  button.disabled=true;

  button.textContent="SAVING...";

  try{

    const user=await getUser();

    if(!user)return;

    const recipient=document.getElementById("recipient").value.trim();

    const account=document.getElementById("account").value.trim();

    const bank=document.getElementById("bank").value;

    const amount=Number(document.getElementById("amount").value);

    const description=document.getElementById("description").value.trim();

    if(!recipient){

      throw new Error("Enter the recipient's full name.");

    }

    if(!/^\d{10}$/.test(account)){

      throw new Error("Enter a valid 10-digit account number.");

    }

    if(!bank){

      throw new Error("Please select the recipient's bank.");

    }

    if(!Number.isFinite(amount)||amount<100){

      throw new Error("Enter a transfer amount of at least ₦100.");

    }

    const storageKey="beeperpay_demo_transactions_"+user.id;

    let records=[];

    try{

      records=JSON.parse(localStorage.getItem(storageKey)||"[]");

      if(!Array.isArray(records))records=[];

    }catch(parseError){

      records=[];

    }

    const reference="BEEPER"+Date.now();

    const record={

      type:"Transfer",

      amount:amount,

      reference:reference,

      date:new Date().toLocaleString("en-NG"),

      bank:bank,

      status:"Demo request only"

    };

    records.push(record);

    localStorage.setItem(storageKey,JSON.stringify(records));

    message.textContent=

      "Demo Transfer Request Created. Amount: ₦"+

      amount.toLocaleString("en-NG")+

      ". Bank: "+bank+

      ". Reference: "+reference+

      ". No money was transferred.";

    message.className="success";

    form.reset();

  }catch(error){

    message.textContent=error.message||"Unable to save demo request.";

    message.className="error";

  }finally{

    button.disabled=false;

    button.textContent="CONTINUE";

  }

});

getUser();

</script>

</body>

</html>
