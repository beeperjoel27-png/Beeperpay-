<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beeperpay | Customer Login</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  padding: 20px;

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  font-family: Arial, sans-serif;

  background: #07152e;

  color: white;

}

.container {

  width: 100%;

  max-width: 400px;

  padding: 30px;

  background: #122747;

  border-radius: 15px;

}

h1 {

  color: #e4b84e;

  text-align: center;

}

.subtitle {

  text-align: center;

  letter-spacing: 2px;

}

h2 {

  text-align: center;

  margin-top: 30px;

}

label {

  display: block;

  margin-top: 20px;

}

input {

  width: 100%;

  padding: 14px;

  margin-top: 8px;

  border: 1px solid #52647e;

  border-radius: 7px;

  font-size: 16px;

}

button {

  width: 100%;

  padding: 15px;

  margin-top: 25px;

  background: #e4b84e;

  border: none;

  border-radius: 7px;

  font-weight: bold;

  font-size: 16px;

  cursor: pointer;

}

a {

  color: #e4b84e;

  text-decoration: none;

}

.footer {

  text-align: center;

  margin-top: 20px;

  line-height: 1.8;

}

#message {

  text-align: center;

  margin-top: 15px;

}

</style>

</head>

<body>

<div class="container">

<h1>BEEPERPAY</h1>

<p class="subtitle">MICROFINANCE BANK</p>

<h2>Customer Login</h2>

<form id="loginForm">

<label for="email">Email Address</label>

<input

  type="email"

  id="email"

  placeholder="Enter your email"

  required

>

<label for="password">Password</label>

<input

  type="password"

  id="password"

  placeholder="Enter your password"

  required

>

<button type="submit">LOGIN</button>

</form>

<p id="message"></p>

<div class="footer">

<p>Don't have an account?

<a href="register.html">Register here</a></p>

<p><a href="index.html">← Back to Home</a></p>

</div>

</div>

<script>

document.getElementById("loginForm")

.addEventListener("submit", function(event) {

  event.preventDefault();

  document.getElementById("message").textContent =

  "Login is not yet connected. Secure authentication must be configured.";

});

</script>

</body>

</html>
