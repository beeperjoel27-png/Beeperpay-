<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beeperpay | Create Account</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  padding: 25px 15px;

  background: #07152e;

  color: white;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 420px;

  margin: 35px auto;

  padding: 28px 22px;

  background: #122747;

  border-radius: 15px;

}

h1 { color: #e4b84e; text-align: center; }

h2 { text-align: center; }

p { text-align: center; color: #ddd; }

label { display: block; margin-top: 15px; }

input {

  width: 100%;

  padding: 13px;

  margin-top: 7px;

  border-radius: 7px;

  font-size: 16px;

}

button {

  width: 100%;

  margin-top: 22px;

  padding: 14px;

  background: #e4b84e;

  color: #07152e;

  border: 0;

  border-radius: 7px;

  font-weight: bold;

}

a { color: #e4b84e; }

#message { overflow-wrap: anywhere; }

</style>

</head>

<body>

<div class="container">

<h1>BEEPERPAY</h1>

<p>MICROFINANCE BANK</p>

<h2>Create Your Account</h2>

<form id="registerForm">

<label>Full Name</label>

<input id="fullName" type="text" required>

<label>Email Address</label>

<input id="email" type="email" required>

<label>Phone Number</label>

<input id="phone" type="tel" required>

<label>Password</label>

<input id="password" type="password" minlength="8" required>

<label>Confirm Password</label>

<input id="confirmPassword" type="password" minlength="8" required>

<button id="registerButton" type="submit">CREATE ACCOUNT</button>

</form>

<p id="message" role="status"></p>

<p>Already have an account?

<a href="login.html">Login here</a></p>

<p><a href="index.html">Back to Home</a></p>

<p>Your money. Your future. Our priority.</p>

<p>Demo registration only. No live banking account is created.</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = window.supabase.createClient(

  "https://wrjvcvxswdojpxzcwyqw.supabase.co",

  "sb_publishable_zTksapAhIoJp_0-9w1twlQ_j7WECGcv"

);

document.getElementById("registerForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const name = document.getElementById("fullName").value.trim();

  const email = document.getElementById("email").value.trim();

  const phone = document.getElementById("phone").value.trim();

  const password = document.getElementById("password").value;

  const confirm = document.getElementById("confirmPassword").value;

  const message = document.getElementById("message");

  const button = document.getElementById("registerButton");

  if (password !== confirm) {

    message.textContent = "Passwords do not match.";

    return;

  }

  button.disabled = true;

  button.textContent = "CREATING ACCOUNT...";

  message.textContent = "";

  try {

    const { error } = await client.auth.signUp({

      email,

      password,

      options: {

        emailRedirectTo: "https://beeperjoel27-png.github.io/Beeperpay-/login.html",

        data: {

          full_name: name,

          phone_number: phone

        }

      }

    });

    if (error) throw error;

    message.textContent =

      "Registration submitted! Check your email for the confirmation link.";

    document.getElementById("registerForm").reset();

  } catch (error) {

    message.textContent = error.message;

  } finally {

    button.disabled = false;

    button.textContent = "CREATE ACCOUNT";

  }

});

</script>

</body>

</html>
