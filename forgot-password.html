<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beeperpay | Forgot Password</title>

<style>

* { box-sizing: border-box; }

body {

    margin: 0;

    padding: 25px 15px;

    background: #07152e;

    color: white;

    font-family: Arial, sans-serif;

}

.container {

    max-width: 420px;

    margin: 55px auto;

    padding: 28px 22px;

    background: #122747;

    border-radius: 15px;

}

h1 {

    color: #e4b84e;

    text-align: center;

}

h2, p { text-align: center; }

p { color: #ddd; }

label {

    display: block;

    margin-top: 20px;

}

input {

    width: 100%;

    padding: 13px;

    margin-top: 7px;

    border: 1px solid #52627a;

    border-radius: 7px;

    font-size: 16px;

}

button {

    width: 100%;

    margin-top: 22px;

    padding: 14px;

    background: #e4b84e;

    color: #07152e;

    border: none;

    border-radius: 7px;

    font-size: 16px;

    font-weight: bold;

}

button:disabled { opacity: .6; }

a { color: #e4b84e; }

#message {

    margin-top: 18px;

    overflow-wrap: anywhere;

}

</style>

</head>

<body>

<div class="container">

<h1>BEEPERPAY</h1>

<p>MICROFINANCE BANK</p>

<h2>Forgot Password?</h2>

<p>Enter your registered email address. We'll send you a password recovery link if the account is eligible.</p>

<form id="forgotForm">

<label for="email">Email Address</label>

<input id="email" type="email" required placeholder="Enter your registered email">

<button id="sendButton" type="submit">

SEND RESET LINK

</button>

</form>

<p id="message" role="status"></p>

<p><a href="login.html">Back to Customer Login</a></p>

<p>Your money. Your future. Our priority.</p>

<p>Demo website. No live banking services are connected.</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://wrjvcvxswdojpxzcwyqw.supabase.co";

const SUPABASE_KEY = "sb_publishable_zTksapAhIoJp_0-9w1twlQ_j7WECGcv";

const client = window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);

const form = document.getElementById("forgotForm");

const message = document.getElementById("message");

const button = document.getElementById("sendButton");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    button.disabled = true;

    button.textContent = "SENDING...";

    message.textContent = "";

    try {

        const { error } = await client.auth.resetPasswordForEmail(

            email,

            {

                redirectTo: "https://beeperjoel27-png.github.io/Beeperpay-/reset-password.html"

            }

        );

        if (error) throw error;

        message.textContent =

            "If the account is eligible, a password recovery email will be sent. Please check your inbox and spam folder.";

    } catch (error) {

        message.textContent = error.message;

    } finally {

        button.disabled = false;

        button.textContent = "SEND RESET LINK";

    }

});

</script>

</body>

</html>
