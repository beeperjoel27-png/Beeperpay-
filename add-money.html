<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Money - Beeperpay</title>

<style>

body{font-family:Arial,sans-serif;background:#f3f5f9;color:#07152e;padding:20px}

.container{max-width:450px;margin:30px auto;background:white;padding:25px;border-radius:12px}

h2{text-align:center;letter-spacing:2px}

.brand{text-align:center;color:#b58a2b;font-size:12px}

label{display:block;margin-top:18px;font-weight:bold}

input,select{width:100%;padding:13px;margin-top:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:7px;font-size:16px}

button{width:100%;padding:14px;margin-top:22px;background:#07152e;color:white;border:0;border-radius:7px;font-weight:bold}

#message{margin-top:18px;line-height:1.6;overflow-wrap:anywhere}

a{color:#07152e}

.notice{font-size:12px;color:#666;margin-top:20px}

</style>

</head>

<body>

<div class="container">

<h2>BEEPERPAY</h2>

<div class="brand">MICROFINANCE BANK</div>

<h3>Add Money</h3>

<form id="addMoneyForm">

<label>Amount (₦)</label>

<input type="number" id="amount" min="100" step="1" required placeholder="Enter amount">

<label>Payment Method</label>

<select id="method" required>

<option value="">Select payment method</option>

<option value="Bank Transfer">Bank Transfer</option>

<option value="Debit Card (Demo)">Debit Card (Demo)</option>

</select>

<button type="submit" id="submitButton">CONTINUE</button>

</form>

<div id="message"></div>

<p><a href="dashboard.html">Back to Dashboard</a></p>

<p><a href="transactions.html">View Transaction History</a></p>

<p class="notice">Demonstration only. No real money will be transferred or added to your wallet.</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = window.supabase.createClient(

"https://wrjvcvxswdojpxzcwyqw.supabase.co",

"sb_publishable_zTksapAhIoJp_0-9w1twlQ_j7WECGcv"

);

const form = document.getElementById("addMoneyForm");

const message = document.getElementById("message");

const button = document.getElementById("submitButton");

async function getUser(){

const {data,error}=await client.auth.getUser();

if(error || !data.user){

window.location.href="login.html";

return null;

}

return data.user;

}

form.addEventListener("submit",async function(e){

e.preventDefault();

button.disabled=true;

button.textContent="SAVING...";

message.textContent="";

try{

const user=await getUser();

if(!user)return;

const amount=Number(document.getElementById("amount").value);

const method=document.getElementById("method").value;

if(!Number.isFinite(amount)||amount<100){

throw new Error("Enter an amount of at least ₦100.");

}

if(!method){

throw new Error("Select a payment method.");

}

const key="beeperpay_demo_transactions_"+user.id;

let records=JSON.parse(localStorage.getItem(key)||"[]");

if(!Array.isArray(records))records=[];

const reference="BEEPER"+Date.now();

records.push({

type:"Add Money",

amount:amount,

reference:reference,

date:new Date().toLocaleString("en-NG"),

method:method,

status:"Demo request only"

});

localStorage.setItem(key,JSON.stringify(records));

message.textContent="Demo request saved successfully! Reference: "+reference+". No money was transferred.";

form.reset();

}catch(error){

message.textContent="Unable to save: "+error.message;

}finally{

button.disabled=false;

button.textContent="CONTINUE";

}

});

getUser();

</script>

</body>

</html>
