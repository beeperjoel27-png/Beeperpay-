<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Money - Beeperpay</title>

<style>

*{box-sizing:border-box}

body{font-family:Arial,sans-serif;background:#f3f5f9;color:#07152e;padding:20px}

.container{max-width:450px;margin:30px auto;background:white;padding:25px;border-radius:12px}

h2{text-align:center;letter-spacing:2px}

.brand{text-align:center;color:#b58a2b;font-size:12px}

.tagline{text-align:center;font-size:11px;color:#687386;margin-top:7px}

label{display:block;margin-top:18px;font-weight:bold}

input,select{width:100%;padding:13px;margin-top:8px;border:1px solid #ccc;border-radius:7px;font-size:16px}

button{width:100%;padding:14px;margin-top:22px;background:#07152e;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer}

button:disabled{opacity:.6}

#message{margin-top:18px;line-height:1.6;overflow-wrap:anywhere;font-size:14px}

a{color:#07152e}

.notice{font-size:12px;color:#666;margin-top:20px;line-height:1.6}

.success{color:#16803c}

.error{color:#b42318}

</style>

</head>

<body>

<div class="container">

<h2>BEEPERPAY</h2>

<div class="brand">MICROFINANCE BANK</div>

<div class="tagline">Your money. Your future. Our priority.</div>

<h3>Add Money</h3>

<form id="addMoneyForm">

<label for="amount">Amount (₦)</label>

<input type="number" id="amount" min="100" step="1" required placeholder="Enter amount">

<label for="method">Payment Method</label>

<select id="method" required>

<option value="">Select payment method</option>

<option value="Bank Transfer">Bank Transfer</option>

<option value="Debit Card (Demo)">Debit Card (Demo)</option>

</select>

<button type="submit" id="submitButton">CONTINUE</button>

</form>

<div id="message"></div>

<p><a href="dashboard.html">Back to Dashboard</a></p>

<p><a href="transactions.html">View Transaction History</a></p>

<p class="notice">

Demonstration only. No real money will be transferred or added to your wallet.

Your request will be recorded for administrative demonstration purposes.

</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// SUPABASE CONNECTION

const client=window.supabase.createClient(

"https://wrjvcvxswdojpxzcwyqw.supabase.co",

"sb_publishable_zTksapAhIoJp_0-9w1twlQ_j7WECGcv"

);

// PAGE ELEMENTS

const form=document.getElementById("addMoneyForm");

const message=document.getElementById("message");

const button=document.getElementById("submitButton");

// MESSAGE DISPLAY

function showMessage(text,type){

message.textContent=text;

message.className=type;

}

// GET AUTHENTICATED CUSTOMER

async function getUser(){

const {data,error}=await client.auth.getUser();

if(error||!data.user){

window.location.href="login.html";

return null;

}

return data.user;

}

// GENERATE REFERENCE

function generateReference(){

return "BEEPER"+Date.now()+Math.floor(Math.random()*1000);

}

// SAVE ADD MONEY REQUEST

form.addEventListener("submit",async function(e){

e.preventDefault();

button.disabled=true;

button.textContent="SAVING...";

showMessage("Saving your demonstration request...","");

try{

const user=await getUser();

if(!user){

throw new Error("Please sign in to continue.");

}

const amount=Number(document.getElementById("amount").value);

const method=document.getElementById("method").value;

if(!Number.isFinite(amount)||amount<100){

throw new Error("Enter an amount of at least ₦100.");

}

if(!Number.isInteger(amount)){

throw new Error("Enter a whole number amount.");

}

if(!method){

throw new Error("Select a payment method.");

}

const reference=generateReference();

const {data,error}=await client

.from("transaction_requests")

.insert({

user_id:user.id,

transaction_type:"Add Money",

amount:amount,

description:"Payment Method: "+method+" | Reference: "+reference,

status:"Pending"

})

.select("id,amount,status,created_at")

.single();

if(error){

throw error;

}

showMessage(

"Your Add Money demonstration request was saved successfully. Reference: "+reference+". Amount: ₦"+Number(data.amount).toLocaleString("en-NG")+". Status: "+data.status+". No money was transferred.",

"success"

);

form.reset();

}catch(error){

console.error("Add Money Error:",error);

showMessage(

"Unable to save request: "+error.message,

"error"

);

}finally{

button.disabled=false;

button.textContent="CONTINUE";

}

});

// CHECK CUSTOMER SESSION

getUser();

</script>

</body>

</html>
