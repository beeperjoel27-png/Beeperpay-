<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beeperpay | Add Money</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  padding: 20px 15px;

  background: #07152e;

  color: white;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 430px;

  margin: 30px auto;

  padding: 25px;

  background: #122747;

  border-radius: 15px;

}

h1 {

  color: #e4b84e;

  text-align: center;

}

h2 { text-align: center; }

label {

  display: block;

  margin-top: 18px;

}

input, select {

  width: 100%;

  padding: 14px;

  margin-top: 8px;

  border-radius: 7px;

  font-size: 16px;

}

button {

  width: 100%;

  padding: 15px;

  margin-top: 22px;

  border: none;

  border-radius: 7px;

  background: #e4b84e;

  color: #07152e;

  font-weight: bold;

  cursor: pointer;

}

.message {

  margin-top: 18px;

  text-align: center;

  line-height: 1.5;

}

a { color: #e4b84e; }

</style>

</head>

<body>

<div class="container">

<h1>BEEPERPAY</h1>

<p style="text-align:center">MICROFINANCE BANK</p>

<h2>Add Money</h2>

<form id="addMoneyForm">

<label>Amount (₦)</label>

<input

  type="number"

  id="amount"

  min="100"

  step="1"

  placeholder="Enter amount"

  required

>

<label>Payment Method</label>

<select id="method" required>

  <option value="">Select payment method</option>

  <option value="Bank Transfer">Bank Transfer (Demo)</option>

  <option value="Debit Card">Debit Card (Demo)</option>

</select>

<button type="submit">CONTINUE</button>

</form>

<div class="message" id="message" role="status"></div>

<p style="text-align:center">

<a href="dashboard.html">Back to Dashboard</a>

</p>

<p style="font-size:12px;text-align:center">

Demonstration only. No payment will be collected and no wallet will be credited.

</p>

</div>

<script>

document.getElementById("addMoneyForm").addEventListener("submit", function(event) {

  event.preventDefault();

  const amount = Number(document.getElementById("amount").value);

  const method = document.getElementById("method").value;

  const message = document.getElementById("message");

  if (!Number.isFinite(amount) || amount < 100) {

    message.textContent = "Please enter at least ₦100.";

    return;

  }

  if (!method) {

    message.textContent = "Please select a payment method.";

    return;

  }

  message.innerHTML =

    "<strong>Demo Request Created</strong><br>" +

    "Amount: ₦" + amount.toLocaleString("en-NG") +

    "<br>Payment Method: " + method +

    "<br><br>No money was transferred or added to your wallet.";

});

</script>

</body>

</html>
