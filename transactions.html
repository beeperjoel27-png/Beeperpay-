<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transaction History - Beeperpay</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:20px;background:#f3f5f9;color:#07152e;font-family:Arial,sans-serif}

.container{max-width:600px;margin:30px auto;background:white;padding:24px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.07)}

.brand{text-align:center}

.brand h2{letter-spacing:2px;margin-bottom:5px}

.brand p{color:#b58a2b;font-size:12px;margin-top:0}

h3{margin-top:28px}

.transaction{border:1px solid #e0e4eb;border-radius:9px;padding:16px;margin:14px 0}

.transaction h4{margin:0 0 10px}

.amount{font-size:21px;font-weight:bold;margin:8px 0}

.detail{font-size:13px;color:#555;line-height:1.8;overflow-wrap:anywhere}

.status{display:inline-block;background:#fff3d5;color:#76520b;padding:6px 9px;border-radius:5px;font-size:11px;margin-top:10px}

.empty{text-align:center;padding:25px;color:#777}

a{color:#07152e;font-weight:bold}

button{padding:11px 16px;border:0;border-radius:6px;background:#07152e;color:white;margin:8px 0;cursor:pointer}

.notice{font-size:12px;color:#666;line-height:1.5;margin-top:22px}

.message{font-size:13px;color:#555;text-align:center;padding:12px}

</style>

</head>

<body>

<div class="container">

<div class="brand">

<h2>BEEPERPAY</h2>

<p>MICROFINANCE BANK</p>

<p>Your money. Your future. Our priority.</p>

</div>

<h3>Transaction History</h3>

<h4>My Transactions</h4>

<button type="button" onclick="loadTransactions()">Refresh</button>

<div id="transactions" class="message">Loading transactions...</div>

<p><a href="dashboard.html">Back to Dashboard</a></p>

<p class="notice">

Demonstration transaction records only. No real banking transactions have occurred.

Records are retrieved from Beeperpay's demonstration database.

</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client=window.supabase.createClient(

"https://wrjvcvxswdojpxzcwyqw.supabase.co",

"sb_publishable_zTksapAhIoJp_0-9w1twlQ_j7WECGcv"

);

const container=document.getElementById("transactions");

function addDetail(parent,label,value){

const line=document.createElement("div");

line.className="detail";

line.textContent=label+": "+(value||"Not provided");

parent.appendChild(line);

}

async function loadTransactions(){

container.textContent="Loading transactions...";

const {data:authData,error:authError}=await client.auth.getUser();

if(authError||!authData.user){

window.location.href="login.html";

return;

}

const {data:records,error}=await client

.from("transaction_requests")

.select("id,transaction_type,amount,description,status,created_at")

.eq("user_id",authData.user.id)

.order("created_at",{ascending:false});

if(error){

console.error("Transaction loading error:",error);

container.textContent="Unable to load transactions. Please refresh and try again.";

return;

}

container.replaceChildren();

if(!records||records.length===0){

const empty=document.createElement("div");

empty.className="empty";

empty.textContent="No transactions yet.";

container.appendChild(empty);

return;

}

records.forEach(function(record){

const card=document.createElement("div");

card.className="transaction";

const heading=document.createElement("h4");

heading.textContent=record.transaction_type||"Transaction";

card.appendChild(heading);

const amount=document.createElement("div");

amount.className="amount";

amount.textContent="₦"+Number(record.amount||0).toLocaleString("en-NG");

card.appendChild(amount);

addDetail(card,"Reference",record.id);

addDetail(card,"Date",

record.created_at

?new Date(record.created_at).toLocaleString("en-NG")

:"Not provided"

);

if(record.description){

const description=document.createElement("div");

description.className="detail";

description.textContent=record.description;

card.appendChild(description);

}

const status=document.createElement("span");

status.className="status";

status.textContent=record.status||"Pending";

card.appendChild(status);

container.appendChild(card);

});

}

loadTransactions();

</script>

</body>

</html>
