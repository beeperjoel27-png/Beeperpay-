

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beeperpay | Customer Login</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      padding: 25px 15px;

      background: #07152e;

      color: white;

      font-family: Arial, sans-serif;

    }

    .container {

      max-width: 420px;

      margin: 45px auto;

      padding: 28px 22px;

      background: #122747;

      border-radius: 15px;

    }

    h1 { color: #e4b84e; text-align: center; }

    h2 { text-align: center; }

    p { text-align: center; color: #ddd; }

    label { display: block; margin-top: 18px; }

    input {

      width: 100%;

      padding: 13px;

      margin-top: 7px;

      border: 1px solid #52627a;

      border-radius: 7px;

      font-size: 16px;

    }

    button {

      width: 100%;

      margin-top: 24px;

      padding: 14px;

      background: #e4b84e;

      color: #07152e;

      border: none;

      border-radius: 7px;

      font-size: 16px;

      font-weight: bold;

    }

    button:disabled { opacity: .6; }

    a { color: #e4b84e; }

    #message { margin-top: 18px; overflow-wrap: anywhere; }

  </style>

</head>

<body>

  <div class="container">

    <h1>BEEPERPAY</h1>

    <p>MICROFINANCE BANK</p>

    <h2>Customer Login</h2>

    <form id="loginForm">

      <label>Email Address</label>

      <input id="email" type="email" required>

      <label>Password</label>

      <input id="password" type="password" required>

      <button id="loginButton" type="submit">LOGIN</button>

    </form>

    <p id="message" role="status"></p>

    <p>Don't have an account?

      <a href="register.html">Register here</a>

    </p>

    <p><a href="index.html">Back to Home</a></p>

    <p>Your money. Your future. Our priority.</p>

    <p>Demo website. No live banking services are connected.</p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =

      "https://wrjvcvxswdojpxzcwyqw.supabase.co";

    const SUPABASE_KEY =

      "sb_publishable_zTksapAhIoJp_0-9w1twlQ_j7WECGcv";

    const client = window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_KEY

    );

    const form = document.getElementById("loginForm");

    const message = document.getElementById("message");

    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;

      button.disabled = true;

      button.textContent = "SIGNING IN...";

      message.textContent = "";

      try {

        const { data, error } =

          await client.auth.signInWithPassword({

            email: email,

            password: password

          });

        if (error) throw error;

        window.location.href = "dashboard.html";

      } catch (error) {

        message.textContent =

          error.message === "Invalid login credentials"

            ? "Email or password is incorrect. Please check and try again."

            : error.message;

      } finally {

        button.disabled = false;

        button.textContent = "LOGIN";

      }

    });

  </script>

</body>

</html>
